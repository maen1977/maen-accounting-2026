name: MAUI build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/Maen.Accounting.Core.Tests/Maen.Accounting.Core.Tests.csproj
      - run: dotnet test tests/Maen.Accounting.Core.Tests/Maen.Accounting.Core.Tests.csproj -c Release --no-restore

  build-android:
    runs-on: ubuntu-latest
    needs: test-core
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore src/Maen.Accounting.App/Maen.Accounting.App.csproj
      - name: Publish APK and AAB
        run: dotnet publish src/Maen.Accounting.App/Maen.Accounting.App.csproj -f net10.0-android -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: maen-accounting-android
          path: |
            src/Maen.Accounting.App/bin/Release/net10.0-android/publish/*.apk
            src/Maen.Accounting.App/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: test-core
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore and build Windows
        run: dotnet build src/Maen.Accounting.App/Maen.Accounting.App.csproj -f net10.0-windows10.0.19041.0 -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: maen-accounting-windows
          path: src/Maen.Accounting.App/bin/Release/net10.0-windows10.0.19041.0/**
          if-no-files-found: error
